<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chambita</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 10px;
      text-align: center;
    }

    .body {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      text-align: center;
      max-width: 320px;
      margin-bottom: 28px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #e5e5e5;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Form */
    .form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: #111;
    }

    .field input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fafafa;
      color: #111;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .field input:focus {
      border-color: #111;
      background: #fff;
    }

    .inline-error {
      font-size: 13px;
      color: #e53e3e;
      min-height: 16px;
    }

    .btn {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: none;
      background: #5d02ef;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }

    .btn:hover   { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <img src="/chambita_logo.png" alt="Chambita" class="logo" id="logo" />
  <div id="content">
    <div class="spinner"></div>
    <p class="body">Un momento...</p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth,
      applyActionCode,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey:     'AIzaSyB7RBqbr0LK8EXJNgO6JENfisjE38wFxX0',
      authDomain: 'chambita-7774d.firebaseapp.com',
      projectId:  'chambita-7774d',
    });

    const auth    = getAuth(app);
    const params  = new URLSearchParams(window.location.search);
    const mode    = params.get('mode');
    const oobCode = params.get('oobCode');
    const el      = document.getElementById('content');

    function renderState(title, body) {
      el.innerHTML = `
        <div class="title">${title}</div>
        <p class="body">${body}</p>
      `;
    }

    function renderError(msg) {
      renderState('Algo salió mal', msg);
    }

    if (!mode || !oobCode) {
      renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.');

    } else if (mode === 'verifyEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('Email verificado', 'Tu correo ha sido verificado. Ya puedes usar Chambita.'))
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else if (mode === 'verifyAndChangeEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('Email actualizado', 'Tu correo ha sido cambiado. Ya puedes iniciar sesión con el nuevo correo.'))
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita el cambio de correo nuevamente desde la app.'));

    } else if (mode === 'resetPassword') {
      verifyPasswordResetCode(auth, oobCode)
        .then(() => {
          el.innerHTML = `
            <div class="title">Nueva contraseña</div>
            <p class="body" style="margin-bottom: 20px;">Ingresa tu nueva contraseña para Chambita.</p>
            <div class="form">
              <div class="field">
                <label for="pwd">Nueva contraseña</label>
                <input type="password" id="pwd" placeholder="Mínimo 6 caracteres" minlength="6" />
              </div>
              <div class="field">
                <label for="pwd2">Confirmar contraseña</label>
                <input type="password" id="pwd2" placeholder="Repite la contraseña" minlength="6" />
              </div>
              <p class="inline-error" id="err"></p>
              <button class="btn" id="btn" onclick="handleReset()">Cambiar contraseña</button>
            </div>
          `;
        })
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else {
      renderError('Acción no reconocida. Usa el enlace exacto que recibiste por correo.');
    }

    window.handleReset = () => {
      const pwd  = document.getElementById('pwd').value;
      const pwd2 = document.getElementById('pwd2').value;
      const err  = document.getElementById('err');
      const btn  = document.getElementById('btn');

      err.textContent = '';

      if (pwd.length < 6) { err.textContent = 'Mínimo 6 caracteres.'; return; }
      if (pwd !== pwd2)   { err.textContent = 'Las contraseñas no coinciden.'; return; }

      btn.disabled    = true;
      btn.textContent = 'Cambiando...';

      confirmPasswordReset(auth, oobCode, pwd)
        .then(() => renderState('Contraseña actualizada', 'Tu contraseña ha sido cambiada. Ya puedes iniciar sesión en Chambita.'))
        .catch(() => {
          err.textContent = 'Error al cambiar la contraseña. El enlace puede haber expirado.';
          btn.disabled    = false;
          btn.textContent = 'Cambiar contraseña';
        });
    };
  </script>

</body>
</html>
