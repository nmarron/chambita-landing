<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chambita</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg:         #ffffff;
      --surface:    #f9f9fb;
      --border:     #e4e4ea;
      --text:       #111116;
      --muted:      #717180;
      --faint:      #b8b8c8;
      --accent:     #fb923c;
      --pink:       #f472b6;
      --purple:     #a78bfa;
      --danger:     #ef4444;
      --danger-bg:  #fef2f2;
      --success:    #16a34a;
      --success-bg: #f0fdf4;
      --sans:       'DM Sans', system-ui, sans-serif;
      --mono:       'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .shell {
      width: 100%;
      max-width: 400px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }

    .wordmark img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: block;
    }

    .wordmark-name {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, #fb923c, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.2px;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.04);
    }

    .state-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .state-icon.success { background: var(--success-bg); color: var(--success); }
    .state-icon.error   { background: var(--danger-bg);  color: var(--danger); }
    .state-icon.loading { background: var(--surface); }

    .state-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .state-body {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.65;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .form-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 -32px 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.1px;
    }

    .field input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .field input::placeholder { color: var(--faint); }
    .field input:focus { border-color: var(--pink); background: var(--bg); }

    .strength-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      margin-top: 6px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }

    .strength-label {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--faint);
      margin-top: 4px;
    }

    .inline-error {
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
      margin-bottom: 4px;
    }

    .btn {
      width: 100%;
      height: 46px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, var(--pink) 100%);
      color: #fff;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.1px;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 8px;
    }

    .btn:hover  { opacity: 0.9; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    footer {
      padding: 20px 24px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    footer p {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--faint);
    }

    footer a { color: var(--faint); text-decoration: none; }
    footer a:hover { color: var(--muted); }

    @media (max-width: 440px) {
      .card { padding: 28px 24px; border-radius: 14px; }
      .divider { margin: 0 -24px 24px; }
    }
  </style>
</head>
<body>

  <main>
    <div class="shell">

      <div class="wordmark">
        <img src="/chambita_logo.png" alt="Chambita" />
        <span class="wordmark-name">Chambita</span>
      </div>

      <div class="card" id="card">
        <div class="state-icon loading">
          <div class="spinner"></div>
        </div>
        <div class="state-title">Procesando</div>
        <p class="state-body">Verificando tu solicitud, un momento...</p>
      </div>

    </div>
  </main>

  <footer>
    <p>
      <a href="https://chambita.app">chambita.app</a>
      &nbsp;·&nbsp;
      <a href="https://chambita.app/privacidad">Privacidad</a>
    </p>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth,
      applyActionCode,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey:     'AIzaSyB7RBqbr0LK8EXJNgO6JENfisjE38wFxX0',
      authDomain: 'chambita-7774d.firebaseapp.com',
      projectId:  'chambita-7774d',
    });

    const auth    = getAuth(app);
    const params  = new URLSearchParams(window.location.search);
    const mode    = params.get('mode');
    const oobCode = params.get('oobCode');
    const card    = document.getElementById('card');

    function renderState(type, icon, title, body) {
      card.innerHTML = `
        <div class="state-icon ${type}">${icon}</div>
        <div class="state-title">${title}</div>
        <p class="state-body">${body}</p>
      `;
    }

    function renderError(msg) {
      renderState('error', '✕', 'Algo salió mal', msg);
    }

    if (!mode || !oobCode) {
      renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.');

    } else if (mode === 'verifyEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('success', '✓', '¡Email verificado!', 'Tu dirección de correo ha sido verificada. Ya puedes usar Chambita con normalidad.'))
        .catch(() => renderError('El enlace de verificación no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else if (mode === 'verifyAndChangeEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('success', '✓', '¡Email actualizado!', 'Tu dirección de correo ha sido cambiada. Ya puedes iniciar sesión con el nuevo correo.'))
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita el cambio de correo nuevamente desde la app.'));

    } else if (mode === 'resetPassword') {
      verifyPasswordResetCode(auth, oobCode)
        .then(() => {
          card.innerHTML = `
            <div class="form-title">Nueva contraseña</div>
            <p class="form-sub">Crea una contraseña segura para tu cuenta de Chambita.</p>
            <hr class="divider" />
            <div class="field">
              <label for="pwd">Nueva contraseña</label>
              <input type="password" id="pwd" placeholder="Mínimo 6 caracteres" minlength="6" oninput="checkStrength()" />
              <div class="strength-bar"><div class="strength-fill" id="sbar"></div></div>
              <span class="strength-label" id="slabel"></span>
            </div>
            <div class="field">
              <label for="pwd2">Confirmar contraseña</label>
              <input type="password" id="pwd2" placeholder="Repite la contraseña" minlength="6" />
            </div>
            <p class="inline-error" id="err"></p>
            <button class="btn" id="btn" onclick="handleReset()">Cambiar contraseña</button>
          `;
        })
        .catch(() => renderError('El enlace para restablecer tu contraseña no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else {
      renderError('Acción no reconocida. Usa el enlace exacto que recibiste por correo.');
    }

    window.checkStrength = () => {
      const pwd   = document.getElementById('pwd')?.value ?? '';
      const bar   = document.getElementById('sbar');
      const label = document.getElementById('slabel');
      if (!bar || !label) return;

      let score = 0;
      if (pwd.length >= 6)           score++;
      if (pwd.length >= 10)          score++;
      if (/[A-Z]/.test(pwd))         score++;
      if (/[0-9]/.test(pwd))         score++;
      if (/[^A-Za-z0-9]/.test(pwd))  score++;

      const levels = [
        { w: '0%',    bg: 'transparent', t: '' },
        { w: '25%',   bg: '#ef4444',     t: 'Muy débil' },
        { w: '50%',   bg: '#f97316',     t: 'Débil' },
        { w: '75%',   bg: '#eab308',     t: 'Aceptable' },
        { w: '90%',   bg: '#22c55e',     t: 'Segura' },
        { w: '100%',  bg: '#16a34a',     t: 'Muy segura' },
      ];

      const lv = levels[Math.min(score, 5)];
      bar.style.width      = pwd.length ? lv.w : '0%';
      bar.style.background = lv.bg;
      label.textContent    = pwd.length ? lv.t : '';
    };

    window.handleReset = () => {
      const pwd  = document.getElementById('pwd').value;
      const pwd2 = document.getElementById('pwd2').value;
      const err  = document.getElementById('err');
      const btn  = document.getElementById('btn');

      err.textContent = '';

      if (pwd.length < 6) { err.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
      if (pwd !== pwd2)   { err.textContent = 'Las contraseñas no coinciden.'; return; }

      btn.disabled    = true;
      btn.textContent = 'Cambiando...';

      confirmPasswordReset(auth, oobCode, pwd)
        .then(() => renderState('success', '✓', '¡Contraseña actualizada!', 'Tu contraseña ha sido cambiada. Ya puedes iniciar sesión en Chambita.'))
        .catch(() => {
          err.textContent = 'Error al cambiar la contraseña. El enlace puede haber expirado.';
          btn.disabled    = false;
          btn.textContent = 'Cambiar contraseña';
        });
    };
  </script>

</body>
</html>
