<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Chambita</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/document-header.css" />
  <link rel="stylesheet" href="/assets/css/documents.css" />
  <link rel="stylesheet" href="/assets/css/auth-action.css" />
</head>

<body>

  <div class="auth-wrap">
    <img src="/assets/images/brand/CH_Black.png" alt="Chambita" class="auth-logo" />
    <div id="content">
      <div class="spinner"></div>
      <p class="auth-body">Un momento...</p>
    </div>
  </div>

  <div class="auth-footer">
    <a href="/">chambita.app</a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth,
      applyActionCode,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey: 'AIzaSyB7RBqbr0LK8EXJNgO6JENfisjE38wFxX0',
      authDomain: 'chambita-7774d.firebaseapp.com',
      projectId: 'chambita-7774d',
    });

    const auth = getAuth(app);
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');
    const el = document.getElementById('content');

    function renderState(title, body) {
      el.innerHTML = `
        <div class="auth-title">${title}</div>
        <p class="auth-body">${body}</p>
      `;
    }

    function renderError(msg) {
      renderState('Algo salió mal', msg);
    }

    if (!mode || !oobCode) {
      renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.');

    } else if (mode === 'verifyEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('Email verificado ✓', 'Tu correo ha sido verificado. Ya puedes usar Chambita.'))
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else if (mode === 'verifyAndChangeEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('Email actualizado ✓', 'Tu correo ha sido cambiado. Ya puedes iniciar sesión con el nuevo correo.'))
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita el cambio de correo nuevamente desde la app.'));

    } else if (mode === 'resetPassword') {
      verifyPasswordResetCode(auth, oobCode)
        .then(() => {
          el.innerHTML = `
            <div class="auth-title">Nueva contraseña</div>
            <p class="auth-body" style="margin-bottom: 20px;">Ingresa tu nueva contraseña para Chambita.</p>
            <div class="auth-form">
              <div class="auth-field">
                <label for="pwd">Nueva contraseña</label>
                <div class="auth-field-input-wrap">
                  <input type="password" id="pwd" placeholder="Mínimo 8 caracteres" minlength="8" />
                  <button type="button" class="toggle-pwd" onclick="togglePwd('pwd')" aria-label="Mostrar contraseña" tabindex="-1">
                    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.3 6.3C3.5 8.1 1.5 12 1.5 12s3.5 7 10.5 7a10.4 10.4 0 0 0 4.6-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                  </button>
                </div>
              </div>
              <div class="auth-field">
                <label for="pwd2">Confirmar contraseña</label>
                <div class="auth-field-input-wrap">
                  <input type="password" id="pwd2" placeholder="Repite la contraseña" minlength="8" />
                  <button type="button" class="toggle-pwd" onclick="togglePwd('pwd2')" aria-label="Mostrar contraseña" tabindex="-1">
                    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.3 6.3C3.5 8.1 1.5 12 1.5 12s3.5 7 10.5 7a10.4 10.4 0 0 0 4.6-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                  </button>
                </div>
              </div>
              <p class="auth-error" id="err"></p>
              <button class="auth-btn" id="btn" onclick="handleReset()">Cambiar contraseña</button>
            </div>
          `;
        })
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else {
      renderError('Acción no reconocida. Usa el enlace exacto que recibiste por correo.');
    }

    window.togglePwd = (id) => {
      const input = document.getElementById(id);
      const btn = input?.nextElementSibling;
      if (!input || !btn) return;

      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('is-visible', show);
      btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    };

    window.handleReset = () => {
      const pwd = document.getElementById('pwd').value;
      const pwd2 = document.getElementById('pwd2').value;
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');

      err.textContent = '';

      if (pwd.length < 8) { err.textContent = 'Mínimo 8 caracteres.'; return; }
      if (pwd !== pwd2) { err.textContent = 'Las contraseñas no coinciden.'; return; }

      btn.disabled = true;
      btn.textContent = 'Cambiando...';

      confirmPasswordReset(auth, oobCode, pwd)
        .then(() => renderState('Contraseña actualizada ✓', 'Tu contraseña ha sido cambiada. Ya puedes iniciar sesión en Chambita.'))
        .catch(() => {
          err.textContent = 'Error al cambiar la contraseña. El enlace puede haber expirado.';
          btn.disabled = false;
          btn.textContent = 'Cambiar contraseña';
        });
    };
  </script>

</body>

</html>
