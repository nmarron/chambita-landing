<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chambita</title>
  <link rel="stylesheet" href="/assets/css/auth-actionPretty.css" />
</head>
<body>

  <main>
    <div class="shell">

      <div class="wordmark">
        <img src="/assets/images/brand/chambita_logo.png" alt="Chambita" />
        <span class="wordmark-name">Chambita</span>
      </div>

      <div class="card" id="card">
        <div class="state-icon loading">
          <div class="spinner"></div>
        </div>
        <div class="state-title">Procesando</div>
        <p class="state-body">Verificando tu solicitud, un momento...</p>
      </div>

    </div>
  </main>

  <footer>
    <p>
      <a href="https://chambita.app">chambita.app</a>
      &nbsp;·&nbsp;
      <a href="https://chambita.app/privacidad">Privacidad</a>
    </p>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth,
      applyActionCode,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey:     'AIzaSyB7RBqbr0LK8EXJNgO6JENfisjE38wFxX0',
      authDomain: 'chambita-7774d.firebaseapp.com',
      projectId:  'chambita-7774d',
    });

    const auth    = getAuth(app);
    const params  = new URLSearchParams(window.location.search);
    const mode    = params.get('mode');
    const oobCode = params.get('oobCode');
    const card    = document.getElementById('card');

    function renderState(type, icon, title, body) {
      card.innerHTML = `
        <div class="state-icon ${type}">${icon}</div>
        <div class="state-title">${title}</div>
        <p class="state-body">${body}</p>
      `;
    }

    function renderError(msg) {
      renderState('error', '✕', 'Algo salió mal', msg);
    }

    if (!mode || !oobCode) {
      renderError('El enlace no es válido o ya expiró. Solicita uno nuevo desde la app.');

    } else if (mode === 'verifyEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('success', '✓', '¡Email verificado!', 'Tu dirección de correo ha sido verificada. Ya puedes usar Chambita con normalidad.'))
        .catch(() => renderError('El enlace de verificación no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else if (mode === 'verifyAndChangeEmail') {
      applyActionCode(auth, oobCode)
        .then(() => renderState('success', '✓', '¡Email actualizado!', 'Tu dirección de correo ha sido cambiada. Ya puedes iniciar sesión con el nuevo correo.'))
        .catch(() => renderError('El enlace no es válido o ya expiró. Solicita el cambio de correo nuevamente desde la app.'));

    } else if (mode === 'resetPassword') {
      verifyPasswordResetCode(auth, oobCode)
        .then(() => {
          card.innerHTML = `
            <div class="form-title">Nueva contraseña</div>
            <p class="form-sub">Crea una contraseña segura para tu cuenta de Chambita.</p>
            <hr class="divider" />
            <div class="field">
              <label for="pwd">Nueva contraseña</label>
              <div class="field-input-wrap">
                <input type="password" id="pwd" placeholder="Mínimo 6 caracteres" minlength="6" oninput="checkStrength()" />
                <button type="button" class="toggle-pwd" onclick="togglePwd('pwd')" aria-label="Mostrar contraseña" tabindex="-1">
                  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.3 6.3C3.5 8.1 1.5 12 1.5 12s3.5 7 10.5 7a10.4 10.4 0 0 0 4.6-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <div class="strength-bar"><div class="strength-fill" id="sbar"></div></div>
              <span class="strength-label" id="slabel"></span>
            </div>
            <div class="field">
              <label for="pwd2">Confirmar contraseña</label>
              <div class="field-input-wrap">
                <input type="password" id="pwd2" placeholder="Repite la contraseña" minlength="6" />
                <button type="button" class="toggle-pwd" onclick="togglePwd('pwd2')" aria-label="Mostrar contraseña" tabindex="-1">
                  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.3 6.3C3.5 8.1 1.5 12 1.5 12s3.5 7 10.5 7a10.4 10.4 0 0 0 4.6-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <p class="inline-error" id="err"></p>
            <button class="btn" id="btn" onclick="handleReset()">Cambiar contraseña</button>
          `;
        })
        .catch(() => renderError('El enlace para restablecer tu contraseña no es válido o ya expiró. Solicita uno nuevo desde la app.'));

    } else {
      renderError('Acción no reconocida. Usa el enlace exacto que recibiste por correo.');
    }

    window.togglePwd = (id) => {
      const input = document.getElementById(id);
      const btn   = input?.nextElementSibling;
      if (!input || !btn) return;

      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      btn.classList.toggle('is-visible', show);
      btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    };

    window.checkStrength = () => {
      const pwd   = document.getElementById('pwd')?.value ?? '';
      const bar   = document.getElementById('sbar');
      const label = document.getElementById('slabel');
      if (!bar || !label) return;

      let score = 0;
      if (pwd.length >= 6)           score++;
      if (pwd.length >= 10)          score++;
      if (/[A-Z]/.test(pwd))         score++;
      if (/[0-9]/.test(pwd))         score++;
      if (/[^A-Za-z0-9]/.test(pwd))  score++;

      const levels = [
        { w: '0%',    bg: 'transparent', t: '' },
        { w: '25%',   bg: '#ef4444',     t: 'Muy débil' },
        { w: '50%',   bg: '#f97316',     t: 'Débil' },
        { w: '75%',   bg: '#eab308',     t: 'Aceptable' },
        { w: '90%',   bg: '#22c55e',     t: 'Segura' },
        { w: '100%',  bg: '#16a34a',     t: 'Muy segura' },
      ];

      const lv = levels[Math.min(score, 5)];
      bar.style.width      = pwd.length ? lv.w : '0%';
      bar.style.background = lv.bg;
      label.textContent    = pwd.length ? lv.t : '';
    };

    window.handleReset = () => {
      const pwd  = document.getElementById('pwd').value;
      const pwd2 = document.getElementById('pwd2').value;
      const err  = document.getElementById('err');
      const btn  = document.getElementById('btn');

      err.textContent = '';

      if (pwd.length < 6) { err.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
      if (pwd !== pwd2)   { err.textContent = 'Las contraseñas no coinciden.'; return; }

      btn.disabled    = true;
      btn.textContent = 'Cambiando...';

      confirmPasswordReset(auth, oobCode, pwd)
        .then(() => renderState('success', '✓', '¡Contraseña actualizada!', 'Tu contraseña ha sido cambiada. Ya puedes iniciar sesión en Chambita.'))
        .catch(() => {
          err.textContent = 'Error al cambiar la contraseña. El enlace puede haber expirado.';
          btn.disabled    = false;
          btn.textContent = 'Cambiar contraseña';
        });
    };
  </script>

</body>
</html>
